name: backend-v2-e2e

# Drives the kernel end to end on every PR and push: a real sidecar in-process, a
# `simulate` request, progress frames, a result, a manifest fetched over HTTP, and
# every signal it names read back.
#
# It used to be one test, `test_v2_roundtrip.py`, over a pipeline of Python stages:
# load → flatten → resolve_goto_from → substitute_params → compile → solve. Every
# stage of that is `gsim-core` now and none of it is Python (#158), so the test and
# the modules it exercised are gone. What is left to drive from here is the half the
# kernel still owns — receive a netlist, solve it, write and serve the result — and
# that is `tests/backend/e2e/`.
#
# No host SPICE simulator is required: the tests that need the `general-simulator`
# binary skip without it, and the netlist they send comes from
# `examples/expected-netlists/`, which `scripts/check-examples.mjs` holds to the byte.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: backend-v2-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v2-e2e:
    name: v2 end-to-end gate (BE-41)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No cache: `uv.lock` is gitignored, so `cache-dependency-glob`'s default
      # `**/uv.lock` matches nothing in a fresh checkout and setup-uv fails the
      # job before it runs anything. Same fix as ci.yml's own python job.
      - uses: astral-sh/setup-uv@v3

      - name: Install workspace packages
        run: uv sync --all-packages --group dev

      - name: ruff lint (simulator)
        run: uv run ruff check packages/simulator/src/

      - name: mypy (simulator)
        run: uv run mypy packages/simulator/src/

      # The directory, not a file. Naming a file is how this gate broke twice: once when
      # `test_v2_comprehensive.py` went with the SPICE paths it covered, once when
      # `test_v2_roundtrip.py` went with the Python compiler it round-tripped through.
      # Both times pytest exited "file or directory not found" before running anything,
      # so the gate failed while testing nothing — and the name of the missing file was
      # the only clue. A directory keeps working when its contents are renamed, and
      # pytest still exits 4 if it ever becomes empty.
      - name: backend end-to-end tests
        run: |
          uv run pytest \
            tests/backend/e2e/ \
            -v --tb=short

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v2-e2e-test-results
          path: |
            .pytest_cache/
          retention-days: 7
