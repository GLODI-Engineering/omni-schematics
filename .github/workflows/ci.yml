name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Architectural invariants (fast, no deps — runs first as a gating signal).
  # See docs/agent-rules/architecture-invariants.md
  # ---------------------------------------------------------------------------
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-invariants.sh

  # ---------------------------------------------------------------------------
  # Frontend: biome + tsc + vitest + production build
  # ---------------------------------------------------------------------------
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose — package.json's `packageManager`
      # field pins pnpm, and specifying both makes action-setup fail with
      # "Multiple versions of pnpm specified" before any step runs.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: biome check
        run: pnpm exec biome check .
      - name: typecheck
        run: pnpm --filter @gensim/frontend typecheck
      - name: build
        run: pnpm --filter @gensim/frontend build
      - name: test
        run: pnpm --filter @gensim/frontend test

  # ---------------------------------------------------------------------------
  # VS Code extension: tsc + vitest, then a real VS Code extension host driven
  # by @vscode/test-electron (needs the built webview bundles and a display).
  # ---------------------------------------------------------------------------
  vscode-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose — package.json's `packageManager`
      # field pins pnpm, and specifying both makes action-setup fail with
      # "Multiple versions of pnpm specified" before any step runs.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: typecheck
        run: pnpm --filter ./apps/vscode-extension typecheck
      - name: build
        run: pnpm --filter ./apps/vscode-extension build
      - name: unit tests
        run: pnpm --filter ./apps/vscode-extension test
      - name: build frontend for webviews
        run: pnpm --filter @gensim/frontend build
      # #159: the extension runs the solver itself, so the run test needs a real
      # binary -- and it is fetched here rather than skipped, for the reason
      # `engine-catalogue-drift` gives about `gsim_py`: a check that cannot fail
      # is not one. Without this the suite prints "skipping the run suite" and
      # the job goes green while nothing holds Run to reaching a result at all.
      #
      # A published release asset rather than a build from source, for two
      # reasons. `general-simulator`'s workspace carries path dependencies on
      # three sibling repositories -- `gs-waveform-measurements`, `general-mna`
      # and `spice-lsp` -- so `git clone && cargo build` fails on a missing
      # manifest, and cloning four default branches would make this gate a
      # tripwire on four other repositories' HEADs. And it pins the version, so
      # a red run here means this repository changed.
      - name: fetch the solver the run test drives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.7.0 --repo GLODI-Engineering/general-simulator \
            --pattern general-simulator-linux-x86_64.tar.gz --dir "$RUNNER_TEMP" --clobber
          tar -xzf "$RUNNER_TEMP/general-simulator-linux-x86_64.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/general-simulator-linux-x86_64/general-simulator" --version
      # No interpreter is prepared for this job, and that is the assertion:
      # since #162 the extension has nothing that could start one, so a VS Code
      # window on a runner with no Python environment configured must still
      # open every example and run one.
      - name: integration tests (real VS Code)
        env:
          GSIM_GENERAL_SIMULATOR_PATH: ${{ runner.temp }}/general-simulator-linux-x86_64/general-simulator
        run: |
          # `pipefail` first: without it the exit status of the pipeline is
          # `tee`'s, which is always 0, so a failing suite would go green --
          # the pipe would hide exactly what it was added to report.
          set -o pipefail
          # The suite skips its run test without a binary and says so. A green
          # job that skipped the one thing #159 is about is indistinguishable
          # from a passing one, which is how the examples' generator arm went
          # unnoticed for two releases -- so grep for the skip.
          xvfb-run -a pnpm --filter ./apps/vscode-extension test:integration | tee /tmp/integration.log
          if grep -q "skipping the run suite" /tmp/integration.log; then
            echo "::error::the run suite skipped, so nothing checked that Run reaches a result"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Rust (Tauri shell): fmt + clippy. Build is skipped here — Tauri builds happen
  # in a release workflow on tag, not on every PR.
  # ---------------------------------------------------------------------------
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: install tauri build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/waveform-store
      # Was apps/desktop/src-tauri, which no longer exists — `cargo metadata`
      # failed on the missing manifest, so this job never checked anything.
      - name: cargo fmt
        run: cargo fmt --manifest-path crates/waveform-store/Cargo.toml --check
      - name: cargo clippy
        run: cargo clippy --manifest-path crates/waveform-store/Cargo.toml -- -D warnings
      - name: cargo test
        run: cargo test --manifest-path crates/waveform-store/Cargo.toml

  # ---------------------------------------------------------------------------
  # E2E: Playwright smoke + undo/redo + persistence + perf (FE-40)
  # Runs after the frontend build succeeds; uploads artifacts on failure.
  # ---------------------------------------------------------------------------
  e2e:
    # Pinned, not `ubuntu-latest`: that is 26.04 now, and Playwright 1.60 refuses
    # it outright — "Playwright does not support chromium on ubuntu26.04-x64" —
    # so `playwright install --with-deps` fails before a single test runs. 24.04
    # is the newest image Playwright supports; unpin it when it supports 26.04.
    runs-on: ubuntu-24.04
    needs: frontend
    # A cap, not a budget. Without one the job inherits GitHub's 6-hour default,
    # so a suite that hangs rather than fails burns six hours of a runner before
    # anyone notices. The healthy run is well under this.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose — package.json's `packageManager`
      # field pins pnpm, and specifying both makes action-setup fail with
      # "Multiple versions of pnpm specified" before any step runs.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Chromium only. `playwright.config.ts` runs the chromium project unless
      # GSIM_E2E_BROWSERS=all, so downloading Firefox and WebKit as well is time
      # spent on browsers no test launches.
      - name: install playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      # The frontend build used to happen here *and* again inside Playwright's
      # own `webServer.command`, which is `build && preview` — the same build
      # twice per run. The webServer one stays, because a developer running
      # `pnpm e2e` locally needs it; this step was the duplicate.
      - name: run e2e tests
        run: pnpm e2e
        env:
          CI: "true"
      - name: upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Schema codegen drift check (FE-02): re-runs codegen and diffs against the
  # committed generated file. Fails if generated/typescript/index.ts is out of
  # sync with the schema sources. It also emitted Pydantic models until #162,
  # for a Python half that no longer exists.
  # ---------------------------------------------------------------------------
  engine-catalogue-drift:
    # The engine owns the component library — what the palette shows, what each component's
    # parameters are, and whether this engine can compile it. The front end's copy is
    # generated from it. This fails when the copy stops matching, which is the only thing
    # keeping it a cache rather than a second opinion.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Built here rather than skipped. The generator exits cleanly when `gsim_py` is absent,
      # which is right for a developer's checkout and wrong for a gate: a check that cannot
      # fail is not one. gsim-core is public, so this needs no credentials.
      - name: build gsim_py from the engine core
        run: |
          git clone --depth 1 https://github.com/GLODI-Engineering/gsim-core.git /tmp/gsim-core
          python -m pip install --upgrade maturin
          maturin build --release --manifest-path /tmp/gsim-core/crates/gsim-py/Cargo.toml --out /tmp/wheels
          python -m pip install /tmp/wheels/gsim_py-*.whl
      - name: engine catalogue drift
        run: GSIM_PYTHON=$(which python) node scripts/gen-engine-catalog.mjs --check

  gsim-wasm-drift:
    # The editor's compiler is a 1.7 MB WebAssembly binary committed in
    # `packages/gsim-wasm/pkg`. A generated artefact in the tree can stop matching its
    # source, and for this one that means the editor silently compiling with a *fork* of
    # the engine -- the two-implementations problem #158 exists to end, wearing a
    # different hat.
    #
    # Two steps, because they fail for different reasons and the message has to say which.
    # The first is offline: the bundle hashes to what `provenance.json` records, exports
    # what its own `.d.ts` declares, and names the engine's current default-branch HEAD --
    # the same question `engine-catalogue-drift` asks of the catalogue. The second rebuilds
    # from the commit the bundle names and compiles every example with the result: if the
    # committed bundle were not what that commit emits, the netlists would differ.
    #
    # Behaviour, not bytes. Two `wasm-pack` runs of one commit agree only if the Rust,
    # wasm-bindgen and wasm-opt versions all match, so a byte comparison would go red on a
    # toolchain bump with nothing wrong -- and a gate that cries wolf gets deleted.
    # Identical netlists from both bundles is the stronger statement anyway.
    name: The committed WebAssembly engine is the engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: the bundle is what it says it is, and the engine has not moved
        run: node scripts/check-gsim-wasm-fresh.mjs --check --against-engine
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # The release binary rather than an action or `cargo install`: pinned to the exact
      # version `provenance.json` records, so the rebuild below uses the same wasm-bindgen
      # and wasm-opt the committed bundle was built with.
      - name: install wasm-pack 0.13.1
        run: |
          curl -fsSL https://github.com/rustwasm/wasm-pack/releases/download/v0.13.1/wasm-pack-v0.13.1-x86_64-unknown-linux-musl.tar.gz \
            | sudo tar -xz --strip-components=1 -C /usr/local/bin \
                wasm-pack-v0.13.1-x86_64-unknown-linux-musl/wasm-pack
          wasm-pack --version
      - name: rebuild from the commit the bundle names
        run: |
          commit=$(node -e 'process.stdout.write(require("./packages/gsim-wasm/provenance.json").engine.commit)')
          node scripts/build-gsim-wasm.mjs --rev "$commit" --out "$RUNNER_TEMP/fresh-bundle"
          cp packages/gsim-wasm/node.js packages/gsim-wasm/compile.js "$RUNNER_TEMP/fresh-bundle/"
      - name: the fresh bundle compiles the examples to the same netlists
        run: node scripts/check-examples.mjs --check --engine "$RUNNER_TEMP/fresh-bundle"

  waveform-wasm-drift:
    # `packages/waveform-wasm/pkg` is a 203 KB binary committed in the tree: the
    # decimator and the `.gsim_samples` reader, which is the only thing in this
    # repository that can turn a container into a picture. A generated artefact
    # can stop matching its source, and for this one that means the viewer
    # drawing a window with a *different* decimator from the one `cargo test`
    # checks -- the two-implementations problem #157 exists to end, wearing a
    # different hat.
    #
    # Unlike `gsim-wasm-drift` this needs no network and no second opinion. The
    # crate is in this repository, so the gate hashes `Cargo.toml`, `Cargo.lock`
    # and every file under `src/` and compares that digest: drift arrives in the
    # same commit that caused it rather than whenever a remote branch moves.
    #
    # Behaviour is checked elsewhere and deliberately: the `frontend` job runs
    # every assertion about envelopes, budgets and surviving peaks *through this
    # bundle* (`src/test-setup.ts` loads it), which is a stronger statement than
    # comparing bytes against a rebuild -- and a byte comparison would go red on
    # a toolchain bump with nothing wrong.
    name: The committed decimator is the crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: the bundle is what it says it is, and the crate has not moved
        run: node scripts/check-waveform-wasm-fresh.mjs --check

  examples-still-work:
    # An example is the one artefact whose whole purpose is to work the first time
    # someone opens it, and it was the only one with no check holding it to that. When this
    # job was written the repository's single example had five separate faults: a block type
    # the engine no longer declares, two aliases the netlist emitter rejects, a document the
    # loader could not even read, and content that no longer matched its own generator.
    #
    # The compile arm needs no Python and no Rust any more (#158): it loads the committed
    # WebAssembly engine and compares each netlist, byte for byte, against
    # `examples/expected-netlists/` -- which was captured from the Python compiler as it
    # stood before #158, so "the same netlist as today" is checked rather than asserted.
    #
    # What a Python environment is still for is the last arm: the generators under
    # `examples/` author their documents with `gsim-tools`, so a document that no longer
    # matches its own generator needs them to be caught. `gsim_py` is built here rather
    # than skipped, for the reason `engine-catalogue-drift` gives: a check that cannot fail
    # is not one.
    #
    # That environment is two `pip install`s into a bare venv now. It used to be
    # `scripts/make-kernel-venv.mjs`, which built the *kernel's* environment -- four
    # workspace packages and their scientific dependencies -- and both the script and the
    # packages are gone (#162). Neither generator ever imported one of them.
    name: The examples still open, compile, and match their generators
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: examples check (no Python, no Rust — the committed WebAssembly engine)
        run: node scripts/check-examples.mjs --check
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build gsim_py from the engine core
        run: |
          git clone --depth 1 https://github.com/GLODI-Engineering/gsim-core.git /tmp/gsim-core
          python -m pip install --upgrade maturin
          maturin build --release --manifest-path /tmp/gsim-core/crates/gsim-py/Cargo.toml --out /tmp/wheels
      # The two packages a generator imports, and nothing else. `gsim-tools` comes from its
      # repository, which is the route the README documents; without it the generator arm
      # reported "generator did not run" on all five examples and the job stayed green -- so
      # the one check holding a committed example to its own `build_*.py` had never actually
      # run in CI.
      - name: an environment the generators can run in
        run: |
          python -m venv "$RUNNER_TEMP/generators"
          "$RUNNER_TEMP/generators/bin/python" -m pip install --quiet --upgrade pip
          "$RUNNER_TEMP/generators/bin/python" -m pip install --quiet /tmp/wheels/gsim_py-*.whl
          "$RUNNER_TEMP/generators/bin/python" -m pip install --quiet \
            'gsim-tools @ git+https://github.com/GLODI-Engineering/gsim-tools'
      # The same command again, now with an interpreter that can run the generators, so the
      # last arm is real rather than reported-as-absent.
      - name: examples check, with the generators
        run: |
          GSIM_PYTHON="$RUNNER_TEMP/generators/bin/python" node scripts/check-examples.mjs --check \
            | tee /tmp/examples.log
          # A run that reported "generator did not run" five times and exited 0 is the failure
          # this step exists to prevent, and it is indistinguishable from a pass without this.
          if grep -q "generator did not run" /tmp/examples.log; then
            echo "::error::a generator did not run, so nothing held an example to its own build_*.py"
            exit 1
          fi
          if ! grep -q "matches its generator" /tmp/examples.log; then
            echo "::error::no example was checked against its generator"
            exit 1
          fi

  keybinding-drift:
    # `package.json`'s keybindings and docs/keyboard-conflicts.md are generated from the
    # schematic's own keymap. This fails when a chord is added to the keymap and the
    # contribution is not regenerated — which would leave VS Code quietly winning that chord.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: keybinding drift check
        run: node scripts/gen-keybindings.mjs --check

  schema-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose — package.json's `packageManager`
      # field pins pnpm, and specifying both makes action-setup fail with
      # "Multiple versions of pnpm specified" before any step runs.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: codegen drift check
        run: pnpm -F @gensim/schemas codegen:check

  # ---------------------------------------------------------------------------
  # Keymap drift check (FE-07): parses keyboard-map.md §1–§9 and asserts every
  # declared chord is registered in apps/frontend/src/canvas/keymap.ts.
  # ---------------------------------------------------------------------------
  keymap-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: keymap drift check
        run: node scripts/check-keymap.mjs

  # ---------------------------------------------------------------------------
  # Conventional Commits: lint every commit message in the PR.
  # Only runs on pull_request — push to main is assumed to come from merged PRs.
  # ---------------------------------------------------------------------------
  commit-lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: webiny/action-conventional-commits@v1.3.0
