# Build the installable artifact and attach it to a GitHub Release.
#
# There was no release workflow here. The .vsix was something a person built on their own
# machine with `pnpm package`, which means the artifact anyone installed came from whatever
# happened to be in that working tree -- the problem `check-webviews-fresh.mjs` was written
# about, one level up. A release built from a tag is reproducible from the tag.
#
# One ubuntu runner is enough and is the point: a .vsix is platform-independent (the only
# native code here is WebAssembly, which is built once and runs everywhere), so there is no
# reason to spend Windows or macOS runner minutes to produce a file that would be identical.
#
# The Marketplace is deliberately not published to. That needs the `gensim` publisher's
# token, which is a decision and a credential belonging to the repository owner rather than
# to CI; see GLODI-Engineering/general-simulator#85. Until then the Release asset is the
# install path: Extensions -> Install from VSIX.
name: release

on:
  push:
    tags:
      - "v*"
  # Buildable without tagging, so the artifact can be checked before a tag exists.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vsix:
    name: Build the .vsix and attach it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # `pnpm package` is the whole sequence -- build the frontend, copy it into the
      # extension's `media/`, then `vsce package`. Running `vsce` alone packages whatever
      # webview bundle is already sitting there, which is why the root script exists.
      - name: Build the .vsix
        run: pnpm package

      # The tag is the version. A tag that disagrees with package.json would ship an
      # artifact whose version is not the one anybody asked for, and nothing downstream
      # would say so.
      - name: The tag matches the manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          manifest=$(node -p "require('./apps/vscode-extension/package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$manifest" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME says $tag, apps/vscode-extension/package.json says $manifest"
            exit 1
          fi
          echo "version $manifest"

      - name: Name it for the version
        id: name
        run: |
          version=$(node -p "require('./apps/vscode-extension/package.json').version")
          mv omni-schematics.vsix "omni-schematics-${version}.vsix"
          echo "path=omni-schematics-${version}.vsix" >> "$GITHUB_OUTPUT"

      # Kept whether or not this run came from a tag, so `workflow_dispatch` is a real way
      # to get a build out without creating a release.
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: ${{ steps.name.outputs.path }}

      - name: Attach it to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "${{ steps.name.outputs.path }}" \
          || gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber "${{ steps.name.outputs.path }}"
