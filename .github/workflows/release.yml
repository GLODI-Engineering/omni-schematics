# Build the installable artifact and attach it to a GitHub Release.
#
# There was no release workflow here. The .vsix was something a person built on their own
# machine with `pnpm package`, which means the artifact anyone installed came from whatever
# happened to be in that working tree -- the problem `check-webviews-fresh.mjs` was written
# about, one level up. A release built from a tag is reproducible from the tag.
#
# One ubuntu runner is enough and is the point: a .vsix is platform-independent (the only
# native code here is WebAssembly, which is built once and runs everywhere), so there is no
# reason to spend Windows or macOS runner minutes to produce a file that would be identical.
#
# Two artifacts, because the .vsix is only half of an install. It carries the editor and no
# kernel: simulation runs in a Python process the extension spawns. `omniSchematics.kernelPython`
# (#134) lets that be an environment the user prepared, which is only a reasonable thing to ask
# if the packages to put in it are downloadable -- hence the wheels job below. Built from the
# same tag as the .vsix, so the pair cannot disagree about the protocol version they speak.
#
# The Marketplace is deliberately not published to. That needs the `gensim` publisher's
# token, which is a decision and a credential belonging to the repository owner rather than
# to CI; see GLODI-Engineering/general-simulator#85. Until then the Release asset is the
# install path: Extensions -> Install from VSIX.
name: release

on:
  push:
    tags:
      - "v*"
  # Buildable without tagging, so the artifact can be checked before a tag exists.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vsix:
    name: Build the .vsix and attach it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # `pnpm package` is the whole sequence -- build the frontend, copy it into the
      # extension's `media/`, then `vsce package`. Running `vsce` alone packages whatever
      # webview bundle is already sitting there, which is why the root script exists.
      - name: Build the .vsix
        run: pnpm package

      # The tag is the version. A tag that disagrees with package.json would ship an
      # artifact whose version is not the one anybody asked for, and nothing downstream
      # would say so.
      - name: The tag matches the manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          manifest=$(node -p "require('./apps/vscode-extension/package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$manifest" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME says $tag, apps/vscode-extension/package.json says $manifest"
            exit 1
          fi
          echo "version $manifest"

      - name: Name it for the version
        id: name
        run: |
          version=$(node -p "require('./apps/vscode-extension/package.json').version")
          mv omni-schematics.vsix "omni-schematics-${version}.vsix"
          echo "path=omni-schematics-${version}.vsix" >> "$GITHUB_OUTPUT"

      # Kept whether or not this run came from a tag, so `workflow_dispatch` is a real way
      # to get a build out without creating a release.
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: ${{ steps.name.outputs.path }}

      - name: Attach it to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "${{ steps.name.outputs.path }}" \
          || gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber "${{ steps.name.outputs.path }}"

  wheels:
    name: Build the kernel wheels and attach them
    runs-on: ubuntu-latest
    # Serialised after `vsix` rather than run beside it: that job is the one that creates the
    # release, and two jobs racing `gh release create` for the same tag is a flake waiting to
    # happen. This one only ever uploads.
    needs: vsix
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3

      # The seven workspace packages the kernel is assembled from. `--all-packages` builds
      # every member of the uv workspace, which is exactly that set; naming them individually
      # would be a second list to keep in step with `pyproject.toml`.
      #
      # Deliberately *not* built here: `gsim_py` (a maturin build belonging to gsim-core,
      # one wheel per platform and interpreter) and `gsim-tools` (another repository's
      # package). Those two are what a user installs alongside, and the kernel starts
      # without them -- a run then answers `SolverUnavailable` naming where to get them.
      #
      # This comment used to call gsim-tools "a private repository". It is public, MIT and
      # pure Python, and that mistake is why the gate below only ever shook hands with the
      # kernel instead of asking it to compile something: a check needing gsim-tools was
      # believed impossible in CI. It is not, and the gate now does it (#147).
      - name: Build the wheels
        run: uv build --all-packages --out-dir dist

      # A wheel per package, or the environment a user builds from these is incomplete in a
      # way that only shows up as an ImportError at spawn time.
      - name: All seven packages built
        run: |
          missing=0
          for pkg in kernel_core schemas components synthesis gsim_model simulator kernel_sidecar; do
            if ls dist/"$pkg"-*.whl >/dev/null 2>&1; then
              echo "ok: $(ls dist/"$pkg"-*.whl)"
            else
              echo "::error::no wheel built for $pkg"
              missing=1
            fi
          done
          exit $missing

      # Proves the set is installable and the kernel starts from it, before anyone is told to
      # install it. A wheel that builds and cannot be installed together with its siblings is
      # one failure this is here to catch, and it costs one venv.
      - name: A venv of nothing but these wheels starts the kernel
        run: |
          python3 -m venv /tmp/kernel-venv
          /tmp/kernel-venv/bin/pip install --quiet dist/*.whl
          set +e
          timeout 90 /tmp/kernel-venv/bin/python -m kernel_sidecar \
            --port 0 --token ci --connect-timeout 5 > /tmp/kernel.log 2>&1
          set -e
          cat /tmp/kernel.log
          if ! grep -q "KERNEL_READY" /tmp/kernel.log; then
            echo "::error::the kernel did not reach KERNEL_READY from a wheel-only venv"
            exit 1
          fi
          # The host refuses an environment whose protocol it does not share (#134), so a
          # release whose wheels announce nothing would be rejected by the .vsix beside it.
          if ! grep -qE "KERNEL_READY .*protocol=[0-9]+" /tmp/kernel.log; then
            echo "::error::KERNEL_READY carried no protocol= field"
            exit 1
          fi

      # And the step that was missing. `KERNEL_READY` is reached with no compiler at all,
      # because `gsim_py_netlist` is imported on the first `simulate` rather than at startup
      # -- so the check above passed for 0.7.0, whose wheels cannot compile anything, and the
      # release shipped. A user who did everything right got a green kernel and a dead Run
      # button (#147).
      #
      # The compile path needs the two packages this job does not build, so it fetches them:
      # `gsim-tools` from its repository (public, pure Python), and a `gsim_py` wheel matching
      # this runner from gsim-core's own release assets. If either is unobtainable, that is
      # itself worth failing a release for -- it is exactly the position the user is left in.
      - uses: actions/setup-python@v5
        with:
          # Pinned because the `gsim_py` wheel is interpreter-specific and this step has to
          # ask for one by tag. 3.12 is the version every piece has a wheel for.
          python-version: "3.12"
      - name: The kernel can compile a schematic, not just start
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3.12 -m venv /tmp/compile-venv
          /tmp/compile-venv/bin/pip install --quiet --upgrade pip
          # One pip install for the local set: two of these packages are named `components`
          # and `schemas`, which belong to other people on PyPI. Installed one at a time, a
          # sibling's requirement resolves from the index and pulls down a stranger.
          /tmp/compile-venv/bin/pip install --quiet dist/*.whl

          # The two engine packages come from the releases `CHANGELOG.md` names, not from
          # whatever is newest and not from a branch. They used to come from `@master` and
          # from an untagged `gh release download`, which takes the latest release -- so the
          # gate and the install instructions were two independent sources of the same two
          # version numbers, free to drift (#153).
          #
          # The drift is silent in the direction that matters. If the engine publishes a
          # release that fixes a compile error, the gate picks it up and goes green while the
          # changelog still points at the broken one: a release that passes its own gate and
          # works on nobody's machine, which is exactly how 0.7.0 shipped. Reading the tag
          # out of the file the user reads makes the thing tested the thing they are told to
          # install, so a stale link fails here instead of on their laptop.
          tag_in_changelog() {
            # $1: the repository the link points at. Exactly one match, or the gate stops:
            # zero means the instructions stopped naming a release and nothing would be
            # pinned; more than one means two links disagree and picking either is a guess.
            local repo="$1" found
            found=$(grep -o "https://github.com/GLODI-Engineering/${repo}/releases/tag/v[0-9][0-9.]*" \
                      CHANGELOG.md | sed 's|.*/tag/||' | sort -u)
            if [ "$(printf '%s\n' "$found" | grep -c .)" -ne 1 ]; then
              echo "::error::CHANGELOG.md must name exactly one ${repo} release; found: ${found:-none}" >&2
              return 1
            fi
            printf '%s\n' "$found"
          }

          GSIM_TOOLS_TAG="$(tag_in_changelog gsim-tools)"
          GSIM_CORE_TAG="$(tag_in_changelog gsim-core)"
          echo "CHANGELOG.md sends the user to gsim-tools ${GSIM_TOOLS_TAG} and gsim-core ${GSIM_CORE_TAG}"

          gh release download "$GSIM_TOOLS_TAG" --repo GLODI-Engineering/gsim-tools \
            --pattern 'gsim_tools-*-py3-none-any.whl' --dir /tmp/gsim-tools --clobber
          gh release download "$GSIM_CORE_TAG" --repo GLODI-Engineering/gsim-core \
            --pattern 'gsim_py-*-cp312-cp312-manylinux*x86_64.whl' --dir /tmp/gsim-py --clobber
          ls -la /tmp/gsim-tools /tmp/gsim-py
          /tmp/compile-venv/bin/pip install --quiet \
            /tmp/gsim-tools/gsim_tools-*.whl /tmp/gsim-py/gsim_py-*.whl

          # The product's own compiler, on the documents the release ships, by the call the
          # `simulate` handler makes. Not a reimplementation of it: the point of this gate is
          # that the route under test is the route the user takes.
          /tmp/compile-venv/bin/python - <<'PY'
          import glob, json, pathlib, sys
          from simulator.compiler.gsim_py_netlist import compile_gsim_document_full

          docs = sorted(glob.glob("examples/*.gsim_sch"))
          if not docs:
              sys.exit("::error::no examples to compile")
          for path in docs:
              netlist, notes = compile_gsim_document_full(pathlib.Path(path).read_text())
              lines = [ln for ln in netlist.splitlines() if ln.strip()]
              if not lines:
                  sys.exit(f"::error::{path} compiled to an empty netlist")
              print(f"ok: {path} -> {len(lines)} netlist lines, {len(notes)} notes")
          print(f"{len(docs)} documents compiled through the product's own path")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-wheels
          path: dist/*.whl

      - name: Attach them to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber dist/*.whl
