# Build the installable artifact and attach it to a GitHub Release.
#
# There was no release workflow here. The .vsix was something a person built on their own
# machine with `pnpm package`, which means the artifact anyone installed came from whatever
# happened to be in that working tree -- the problem `check-webviews-fresh.mjs` was written
# about, one level up. A release built from a tag is reproducible from the tag.
#
# One ubuntu runner is enough and is the point: a .vsix is platform-independent (the only
# native code here is WebAssembly, which is built once and runs everywhere), so there is no
# reason to spend Windows or macOS runner minutes to produce a file that would be identical.
#
# One artifact, because the .vsix is the whole install. It used to be half of one: a run went to
# a Python process the extension spawned, so the release also carried the wheels to build that
# process's environment from, and the two had to agree about the protocol version they spoke.
# The extension runs the solver itself now (#159), compiles with `gsim-core` built to
# WebAssembly inside the package (#158), and the sidecar is deleted (#162). What a user needs
# besides this file is a `general-simulator` binary, which is another repository's release.
#
# The Marketplace is deliberately not published to. That needs the `gensim` publisher's
# token, which is a decision and a credential belonging to the repository owner rather than
# to CI; see GLODI-Engineering/general-simulator#85. Until then the Release asset is the
# install path: Extensions -> Install from VSIX.
name: release

on:
  push:
    tags:
      - "v*"
  # Buildable without tagging, so the artifact can be checked before a tag exists.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vsix:
    name: Build the .vsix and attach it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # `pnpm package` is the whole sequence -- build the frontend, copy it into the
      # extension's `media/`, then `vsce package`. Running `vsce` alone packages whatever
      # webview bundle is already sitting there, which is why the root script exists.
      - name: Build the .vsix
        run: pnpm package

      # The tag is the version. A tag that disagrees with package.json would ship an
      # artifact whose version is not the one anybody asked for, and nothing downstream
      # would say so.
      - name: The tag matches the manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          manifest=$(node -p "require('./apps/vscode-extension/package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$manifest" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME says $tag, apps/vscode-extension/package.json says $manifest"
            exit 1
          fi
          echo "version $manifest"

      # The .vsix carries two WebAssembly bundles, bundled into the webview by Vite:
      # the schematic compiler (#158, `gsim-core`) and the decimator that reads a
      # `.gsim_samples` container (#157, `crates/waveform-store`). A release missing
      # the first would install, open a sheet, and fail every Run with "the schematic
      # compiler did not load" -- 0.7.0's failure mode exactly, one layer over. A
      # release missing the second would run and then plot nothing, which is the
      # failure #157 was opened to end.
      - name: The .vsix carries the compiler and the decimator
        run: |
          shipped=$(unzip -l omni-schematics.vsix | grep -cE 'gsim_wasm_bg-[^/]*\.wasm$' || true)
          if [ "$shipped" -lt 1 ]; then
            echo "::error::the packaged .vsix has no engine .wasm — the webview has no compiler"
            unzip -l omni-schematics.vsix | tail -40
            exit 1
          fi
          decimator=$(unzip -l omni-schematics.vsix | grep -cE 'waveform_store_bg-[^/]*\.wasm$' || true)
          if [ "$decimator" -lt 1 ]; then
            echo "::error::the packaged .vsix has no decimator .wasm — a run would plot nothing"
            unzip -l omni-schematics.vsix | tail -40
            exit 1
          fi
          unzip -l omni-schematics.vsix | grep -E '\.wasm$'

      # And that it compiles. Every example, to the netlist recorded for it, byte for
      # byte, through the bundle this .vsix was built from.
      #
      # ## What this replaces, and why it is not just `check-examples.mjs --check`
      #
      # The `wheels` job used to carry a gate that built nine wheels into a venv and
      # compiled the shipped examples with the Python kernel in it. That gate existed
      # because of #147: 0.7.0 shipped a release whose kernel started and could not
      # compile, and nothing noticed. The kernel is gone (#162) and the compiler is in
      # the package, so the question it asked is now asked of the package -- but the
      # *reason* it existed has to survive the move, and a bare `--check` does not carry
      # it. `check-examples.mjs` exits 0 when it finds nothing to check, and this
      # repository has lost four gates to exactly that shape: `backend.yml` naming a
      # deleted file, the examples' generator arm reporting "generator did not run" five
      # times, the committed examples with no freshness check at all, and #202. A gate
      # that cannot fail is not one.
      #
      # So three arms, each failing on its own:
      #
      #   1. `--check` itself -- a document that does not open, a block the engine
      #      cannot compile, or a netlist that differs from the recorded one by a byte.
      #   2. The count. Every `examples/*.gsim_sch` must have compiled, and there must
      #      be at least the five the .vsix bundles (`check-bundled-examples.mjs` holds
      #      the package to that same set). A run that compiled none is the failure
      #      above wearing a tick.
      #   3. No interpreter. `env -i` with a PATH holding `node` and nothing else, and
      #      `GSIM_PYTHON` pointed at nothing, so the claim is enforced rather than
      #      asserted -- the step fails outright if `python`, `python3` or `uv` can be
      #      reached from it. The compile arm imports the committed WebAssembly bundle
      #      and never spawns anything; an interpreter is only ever used by arm 6, the
      #      generators, and it is deliberately denied one here. That arm is checked
      #      *with* one in `ci.yml`'s `examples-still-work`, which is where it belongs.
      - name: Every example compiles through the engine that shipped, with no interpreter anywhere
        run: |
          set -o pipefail
          sandbox="$RUNNER_TEMP/no-interpreter"
          mkdir -p "$sandbox"
          ln -sf "$(command -v node)" "$sandbox/node"
          for exe in python python3 uv; do
            if env -i PATH="$sandbox" /bin/sh -c "command -v $exe" >/dev/null 2>&1; then
              echo "::error::$exe is reachable from this step's PATH, so it cannot claim to compile without one"
              exit 1
            fi
          done

          expected=$(ls examples/*.gsim_sch | wc -l)
          echo "examples/ holds $expected document(s)"
          if [ "$expected" -lt 5 ]; then
            echo "::error::only $expected example(s) in examples/, and the .vsix bundles five"
            exit 1
          fi

          env -i PATH="$sandbox" HOME="$HOME" TMPDIR="$RUNNER_TEMP" GSIM_PYTHON=/nonexistent/no-interpreter \
            node scripts/check-examples.mjs --check | tee "$RUNNER_TEMP/examples.log"

          compiled=$(grep -c 'compiles to the recorded netlist, byte for byte' "$RUNNER_TEMP/examples.log" || true)
          if [ "$compiled" -ne "$expected" ]; then
            echo "::error::$compiled of $expected example(s) compiled through the committed engine"
            exit 1
          fi
          if ! grep -q "check-examples: $expected example(s) OK." "$RUNNER_TEMP/examples.log"; then
            echo "::error::check-examples did not report all $expected example(s) OK"
            exit 1
          fi
          echo "$compiled of $expected example(s) compiled through the committed WebAssembly engine, with no interpreter reachable"

      # #153, kept, and asked of the thing that ships rather than of a download. The
      # install instructions name a gsim-core release; the editor compiles with whatever
      # commit `provenance.json` records. Two independent sources of one version number,
      # free to drift -- and silent in the direction that matters, since a changelog
      # pointing at an engine older than the one in the package is a release that works
      # and documents something else.
      #
      # Scoped to the newest `## ` section since 0.11.0. It read the whole file, which
      # required every release to *delete* the previous one's engine link to keep the
      # count at one -- so the changelog was losing the record of which engine each
      # version carried, and the gate was what forced that. The claim is about the
      # release being built, so the newest entry is where to ask it.
      - name: The engine in the package is the engine the changelog names
        run: |
          # Exactly one match, or the gate stops: zero means the newest entry stopped
          # naming a release and nothing would be pinned; more than one means two links
          # in it disagree and picking either is a guess.
          found=$(awk '/^## /{n++} n==1' CHANGELOG.md \
                    | grep -o "https://github.com/GLODI-Engineering/gsim-core/releases/tag/v[0-9][0-9.]*" \
                    | sed 's|.*/tag/v||' | sort -u)
          if [ "$(printf '%s\n' "$found" | grep -c .)" -ne 1 ]; then
            echo "::error::CHANGELOG.md's newest entry must name exactly one gsim-core release; found: ${found:-none}"
            exit 1
          fi
          shipped=$(node -p "require('./packages/gsim-wasm/provenance.json').engine.version")
          echo "CHANGELOG.md names gsim-core $found; the package compiles with $shipped"
          if [ "$found" != "$shipped" ]; then
            echo "::error::CHANGELOG.md names gsim-core $found but packages/gsim-wasm was built from $shipped"
            exit 1
          fi

      - name: Name it for the version
        id: name
        run: |
          version=$(node -p "require('./apps/vscode-extension/package.json').version")
          mv omni-schematics.vsix "omni-schematics-${version}.vsix"
          echo "path=omni-schematics-${version}.vsix" >> "$GITHUB_OUTPUT"

      # Kept whether or not this run came from a tag, so `workflow_dispatch` is a real way
      # to get a build out without creating a release.
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: ${{ steps.name.outputs.path }}

      - name: Attach it to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "${{ steps.name.outputs.path }}" \
          || gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber "${{ steps.name.outputs.path }}"
