# Build the installable artifact and attach it to a GitHub Release.
#
# There was no release workflow here. The .vsix was something a person built on their own
# machine with `pnpm package`, which means the artifact anyone installed came from whatever
# happened to be in that working tree -- the problem `check-webviews-fresh.mjs` was written
# about, one level up. A release built from a tag is reproducible from the tag.
#
# One ubuntu runner is enough and is the point: a .vsix is platform-independent (the only
# native code here is WebAssembly, which is built once and runs everywhere), so there is no
# reason to spend Windows or macOS runner minutes to produce a file that would be identical.
#
# Two artifacts, because the .vsix is only half of an install. It carries the editor and no
# kernel: simulation runs in a Python process the extension spawns. `omniSchematics.kernelPython`
# (#134) lets that be an environment the user prepared, which is only a reasonable thing to ask
# if the packages to put in it are downloadable -- hence the wheels job below. Built from the
# same tag as the .vsix, so the pair cannot disagree about the protocol version they speak.
#
# The Marketplace is deliberately not published to. That needs the `gensim` publisher's
# token, which is a decision and a credential belonging to the repository owner rather than
# to CI; see GLODI-Engineering/general-simulator#85. Until then the Release asset is the
# install path: Extensions -> Install from VSIX.
name: release

on:
  push:
    tags:
      - "v*"
  # Buildable without tagging, so the artifact can be checked before a tag exists.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vsix:
    name: Build the .vsix and attach it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # `pnpm package` is the whole sequence -- build the frontend, copy it into the
      # extension's `media/`, then `vsce package`. Running `vsce` alone packages whatever
      # webview bundle is already sitting there, which is why the root script exists.
      - name: Build the .vsix
        run: pnpm package

      # The tag is the version. A tag that disagrees with package.json would ship an
      # artifact whose version is not the one anybody asked for, and nothing downstream
      # would say so.
      - name: The tag matches the manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          manifest=$(node -p "require('./apps/vscode-extension/package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$manifest" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME says $tag, apps/vscode-extension/package.json says $manifest"
            exit 1
          fi
          echo "version $manifest"

      - name: Name it for the version
        id: name
        run: |
          version=$(node -p "require('./apps/vscode-extension/package.json').version")
          mv omni-schematics.vsix "omni-schematics-${version}.vsix"
          echo "path=omni-schematics-${version}.vsix" >> "$GITHUB_OUTPUT"

      # Kept whether or not this run came from a tag, so `workflow_dispatch` is a real way
      # to get a build out without creating a release.
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: ${{ steps.name.outputs.path }}

      - name: Attach it to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "${{ steps.name.outputs.path }}" \
          || gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber "${{ steps.name.outputs.path }}"

  wheels:
    name: Build the kernel wheels and attach them
    runs-on: ubuntu-latest
    # Serialised after `vsix` rather than run beside it: that job is the one that creates the
    # release, and two jobs racing `gh release create` for the same tag is a flake waiting to
    # happen. This one only ever uploads.
    needs: vsix
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3

      # The seven workspace packages the kernel is assembled from. `--all-packages` builds
      # every member of the uv workspace, which is exactly that set; naming them individually
      # would be a second list to keep in step with `pyproject.toml`.
      #
      # Deliberately *not* built here: `gsim_py` (a maturin build belonging to gsim-core) and
      # `gsim-tools` (a private repository). Those two are what a user installs by hand, and
      # the kernel starts without them -- a run then answers `SolverUnavailable` naming the
      # build step. Shipping an editor that opens schematics is worth doing on its own.
      - name: Build the wheels
        run: uv build --all-packages --out-dir dist

      # A wheel per package, or the environment a user builds from these is incomplete in a
      # way that only shows up as an ImportError at spawn time.
      - name: All seven packages built
        run: |
          missing=0
          for pkg in kernel_core schemas components synthesis gsim_model simulator kernel_sidecar; do
            if ls dist/"$pkg"-*.whl >/dev/null 2>&1; then
              echo "ok: $(ls dist/"$pkg"-*.whl)"
            else
              echo "::error::no wheel built for $pkg"
              missing=1
            fi
          done
          exit $missing

      # Proves the set is installable and the kernel starts from it, before anyone is told to
      # install it. A wheel that builds and cannot be installed together with its siblings is
      # the failure this is here to catch, and it costs one venv.
      - name: A venv of nothing but these wheels starts the kernel
        run: |
          python3 -m venv /tmp/kernel-venv
          /tmp/kernel-venv/bin/pip install --quiet dist/*.whl
          set +e
          timeout 90 /tmp/kernel-venv/bin/python -m kernel_sidecar \
            --port 0 --token ci --connect-timeout 5 > /tmp/kernel.log 2>&1
          set -e
          cat /tmp/kernel.log
          if ! grep -q "KERNEL_READY" /tmp/kernel.log; then
            echo "::error::the kernel did not reach KERNEL_READY from a wheel-only venv"
            exit 1
          fi
          # The host refuses an environment whose protocol it does not share (#134), so a
          # release whose wheels announce nothing would be rejected by the .vsix beside it.
          if ! grep -qE "KERNEL_READY .*protocol=[0-9]+" /tmp/kernel.log; then
            echo "::error::KERNEL_READY carried no protocol= field"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-wheels
          path: dist/*.whl

      - name: Attach them to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber dist/*.whl
