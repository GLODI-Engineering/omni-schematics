[project]
name = "simulator"
version = "0.1.0"
description = "Simulation pipeline — solver adapters, post-processing, result writing. Compiling a schematic is the editor's job (#158), not this package's."
requires-python = ">=3.11"
dependencies = [
    "schemas",
    # `gsim-tools` is not declared here, and since #158 nothing in this package
    # imports it: compiling a `.gsim_sch` document is the editor's job, done with
    # `gsim-core` in WebAssembly, and what reaches this package is netlist text.
    # It would not be declarable anyway -- published to no index (a public
    # repository, but 404 on PyPI), so there is no version to depend on, and an
    # optional extra does not help: uv locks every extra, so a path source has to
    # exist at lock time either way. See the root pyproject.toml's
    # `[tool.uv.sources]` note for the by-hand install, which the example
    # generators under `examples/` still want.
    "numpy>=1.26",
    "scipy>=1.13",
    "sympy>=1.13",
    "h5py>=3.11",
    "networkx>=3.3",
    "jsonschema>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simulator"]

[tool.pytest.ini_options]
markers = [
    "integration: requires the general-simulator binary on the host",
]
