# Pre-commit hooks. Install once: `pipx run pre-commit install --install-hooks`
# (or `pre-commit` from any environment of your own). Then it runs automatically
# on every commit, and `pre-commit install --hook-type commit-msg` enables the
# conventional-commits check on the commit message itself.
#
# To run all hooks manually across the repo:  pre-commit run --all-files
#
# The invocation used to be `uv run pre-commit`, because this was a uv workspace
# and `pre-commit` was in its dev group. There is no uv workspace and no Python
# package here any more (#162).

default_language_version:
  python: python3

default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  # -------------------------------------------------------------------------
  # File hygiene — fast, language-agnostic checks.
  # -------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$  # markdown uses trailing spaces for line breaks
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^\.archon/workflows/.*\.template\.yaml$  # contains {{...}} placeholders
      - id: check-json
        exclude: ^apps/frontend/tsconfig\.json$  # tsconfig.json allows comments
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # ── Gotchas index regen ────────────────────────────────────────────────────
  - repo: local
    hooks:
      - id: gotchas-index
        name: regenerate docs/gotchas/INDEX.md
        language: system
        entry: bash scripts/gotchas-index.sh
        files: '^docs/gotchas/GOTCHA-.*\.md$'
        pass_filenames: false

  # -------------------------------------------------------------------------
  # TS / JS / JSON — biome (local hook so the pinned version in package.json wins).
  # -------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: biome-check
        name: biome check
        entry: pnpm exec biome check --write --no-errors-on-unmatched
        language: system
        types_or: [ts, tsx, javascript, jsx, json]
        pass_filenames: true

  # -------------------------------------------------------------------------
  # Rust — the one crate in this repository. The manifest named here was
  # `apps/desktop/src-tauri/Cargo.toml`, which has not existed for some time;
  # `cargo fmt` then failed on a missing manifest for every Rust commit.
  # -------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --manifest-path crates/waveform-store/Cargo.toml --check
        language: system
        types: [rust]
        pass_filenames: false

  # -------------------------------------------------------------------------
  # Architectural invariants — fast grep gate.
  # See docs/agent-rules/architecture-invariants.md
  # -------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: check-invariants
        name: architectural invariants
        entry: ./scripts/check-invariants.sh
        language: system
        pass_filenames: false
        always_run: true

  # -------------------------------------------------------------------------
  # Conventional commits — validates the commit message on the commit-msg stage.
  # Allowed types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert.
  # Examples:  feat(canvas): add orthogonal wire router
  #            fix(solver): handle stdout chunks larger than 64KB
  #            chore: bump ruff to 0.7.4
  # -------------------------------------------------------------------------
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - "--strict"
          - "feat"
          - "fix"
          - "docs"
          - "style"
          - "refactor"
          - "perf"
          - "test"
          - "build"
          - "ci"
          - "chore"
          - "revert"
